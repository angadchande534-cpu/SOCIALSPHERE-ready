<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Saved | SocialSphere</title><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/instagram.css"><link rel="stylesheet" href="/css/ultimate.css"><script src="/js/api.js"></script>  <link rel="stylesheet" href="/css/premium.css">
</head>
<body class="instagram-page">
<header class="topbar insta-topbar"><nav class="navwrap"><a class="brand insta-brand" href="/feed"><span class="brandmark">S</span><span>SocialSphere</span></a><div class="navlinks"><a href="/feed">⌂ <span>Home</span></a><a href="/search">⌕ <span>Search</span></a><a href="/create-post">⊞ <span>Create</span></a><a class="active" href="/bookmarks">◇ <span>Saved</span></a><a href="/messages">✉ <span>Messages</span></a><a href="/profile">◎ <span>Profile</span></a></div></nav></header>
<main class="insta-saved-shell"><div class="saved-title"><h1>Saved</h1><a class="profile-action-button" href="/feed">Explore posts</a></div><section id="saved" class="saved-list"><div class="insta-empty">Loading saved posts…</div></section></main>
<nav class="mobile-bottom-nav"><a href="/feed">⌂<span>Home</span></a><a href="/search">⌕<span>Search</span></a><a class="mobile-create" href="/create-post">＋<span>Create</span></a><a href="/messages">✉<span>Messages</span></a><a href="/profile">◎<span>Profile</span></a></nav><div class="toast" id="toast"></div>
<script>
if(!token())backendPage('/login');const saved=document.getElementById('saved');const toast=document.getElementById('toast');function notify(m){toast.textContent=m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500)}
function media(p){if(!p.image)return'';const url=fileUrl(p.image);return p.media_type==='video'||/\.(mp4|webm|ogv|ogg|mov)(\?|$)/i.test(p.image)?`<video class="post-media" src="${url}" controls playsinline preload="metadata"></video>`:`<img class="post-media" src="${url}" alt="Saved post">`;}
function card(p){return `<article class="insta-post" id="post-${p.id}"><header class="insta-post-head"><a href="/profile?user_id=${p.user_id}"><img class="avatar" src="${fileUrl(p.profile_image,p.username)}" alt=""></a><div><strong>${escapeHtml(p.username)}</strong><small>${new Date(p.created_at).toLocaleString()}</small></div></header>${media(p)}${p.caption?`<p class="insta-caption"><b>${escapeHtml(p.username)}</b> ${escapeHtml(p.caption)}</p>`:''}<div class="saved-actions"><button class="profile-action-button" onclick="removeSave(${p.id})">Remove from saved</button></div></article>`}
async function load(){try{const posts=await api('/api/posts/bookmarks');saved.innerHTML=posts.length?posts.map(card).join(''):'<div class="insta-empty"><h2>No saved posts</h2><p>Save posts from your feed and they will appear here.</p><a class="btn" href="/feed">Explore feed</a></div>';}catch(error){saved.innerHTML=`<div class="insta-empty">${escapeHtml(error.message)}</div>`}}
async function removeSave(id){try{await api(`/api/posts/${id}/bookmark`,{method:'POST'});document.getElementById(`post-${id}`)?.remove();notify('Removed from saved');if(!saved.children.length)load();}catch(error){notify(error.message)}}load();
</script>
<style>.insta-saved-shell{width:min(100%,650px);margin:auto;padding:35px 15px 90px}.saved-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.saved-title h1{margin:0}.saved-actions{padding:12px 14px 16px}.profile-action-button{border:0;border-radius:8px;background:#363636;color:white;padding:8px 14px;font-weight:700;cursor:pointer}</style>
</body></html>
