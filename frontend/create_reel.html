<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Create Reel | SocialSphere</title><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/instagram.css"><link rel="stylesheet" href="/css/ultimate.css"><script src="/js/api.js"></script>  <link rel="stylesheet" href="/css/premium.css">
</head><body class="u-page">
<header class="u-top"><a class="u-brand" href="/reels">← SocialSphere Reels</a><span class="u-muted">HD upload</span></header>
<main class="u-shell"><section class="u-card"><h1>Create a reel</h1><p class="u-muted">Upload MP4, MOV or WebM. Original quality is preserved up to 250 MB. 9:16 video is recommended.</p>
<form id="form"><div class="u-field"><label>Video</label><input id="video" name="video" type="file" accept="video/mp4,video/webm,video/quicktime" required></div><div id="preview" class="upload-drop"><div><b>Choose your reel</b><p class="u-muted">For best results: 1080 × 1920, H.264 MP4</p></div></div><div class="u-field"><label>Caption</label><textarea id="caption" maxlength="2200" placeholder="Write a caption…"></textarea></div><div class="u-field"><label>Audio name</label><input id="audioName" maxlength="120" value="Original audio"></div><div class="u-field"><label>Cover image (optional)</label><input id="cover" type="file" accept="image/*"></div><button id="submit" class="u-btn primary" type="submit">Upload reel in HD</button><div class="upload-progress"><b id="bar"></b></div><p id="status" class="u-muted"></p></form></section></main>
<script>
let meta={duration:null,width:null,height:null},objectUrl='';const input=document.getElementById('video'),preview=document.getElementById('preview'),status=document.getElementById('status');
input.onchange=()=>{const f=input.files[0];if(!f)return;if(f.size>250*1024*1024){status.textContent='Video must be under 250 MB';input.value='';return}if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);preview.innerHTML=`<video id="pv" src="${objectUrl}" controls playsinline></video>`;const v=document.getElementById('pv');v.onloadedmetadata=()=>{meta={duration:v.duration,width:v.videoWidth,height:v.videoHeight};status.textContent=`${v.videoWidth}×${v.videoHeight} • ${Math.round(v.duration)}s • ${(f.size/1024/1024).toFixed(1)} MB`;};};
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const f=input.files[0];if(!f)return;const btn=document.getElementById('submit');btn.disabled=true;status.textContent='Uploading…';document.getElementById('bar').style.width='35%';const body=new FormData();body.append('video',f);body.append('caption',document.getElementById('caption').value);body.append('audio_name',document.getElementById('audioName').value||'Original audio');if(meta.duration)body.append('duration_seconds',meta.duration);if(meta.width)body.append('width',meta.width);if(meta.height)body.append('height',meta.height);const cover=document.getElementById('cover').files[0];if(cover)body.append('cover',cover);try{await api('/api/reels',{method:'POST',body});document.getElementById('bar').style.width='100%';status.textContent='Uploaded. Opening Reels…';setTimeout(()=>location.href='/reels',500)}catch(err){status.textContent=err.message;document.getElementById('bar').style.width='0';btn.disabled=false}};
ensureAuthenticated();
</script></body></html>
