<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Reels | SocialSphere</title><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/instagram.css"><link rel="stylesheet" href="/css/ultimate.css"><script src="/js/api.js"></script>  <link rel="stylesheet" href="/css/premium.css">
</head><body class="u-page">
<header class="u-top"><a class="u-brand" href="/feed">SocialSphere</a><div class="u-actions"><a class="u-btn primary" href="/create-reel">＋ Create reel</a><a class="u-icon" href="/messages" title="Messages">✉</a></div></header>
<main id="stage" class="reels-stage"><div class="reel-empty">Loading reels…</div></main>
<section id="comments" class="reel-comments"><div style="display:flex;align-items:center;justify-content:space-between"><h3>Comments</h3><button class="u-icon" onclick="closeComments()">×</button></div><div id="commentsList" class="comments-scroll"></div><form id="commentForm" class="comment-form"><input id="commentInput" maxlength="1000" placeholder="Add a comment…"><button class="u-btn primary">Post</button></form></section>
<script>
const stage=document.getElementById('stage');let me=null,reels=[],activeId=null,observer=null,viewTimers=new Map();
function action(icon,count,onclick,cls=''){return `<button class="reel-action ${cls}" onclick="${onclick}">${icon}<span>${count??''}</span></button>`}
function reelHtml(r){return `<article class="reel-slide" data-id="${r.id}"><video class="reel-video" src="${fileUrl(r.video_url)}" ${r.cover_url?`poster="${fileUrl(r.cover_url)}"`:''} playsinline loop preload="metadata"></video><span class="reel-quality">${escapeHtml(r.quality_label||'HD')}</span><div class="reel-overlay"><a class="reel-user" href="/profile?user_id=${r.user_id}"><img src="${fileUrl(r.profile_image,r.username)}"><b>@${escapeHtml(r.username)}</b></a><p class="reel-caption">${escapeHtml(r.caption||'')}</p><div class="reel-audio">♫ ${escapeHtml(r.audio_name||'Original audio')}</div></div><aside class="reel-rail">${action(r.liked_by_me?'♥':'♡',r.likes_count,`toggleLike(${r.id})`,r.liked_by_me?'liked':'')}${action('◯',r.comments_count,`openComments(${r.id})`)}${action('↗','',`shareReel(${r.id})`)}${r.user_id===me?.id?action('⌫','',`deleteReel(${r.id})`):''}<button class="reel-action" onclick="toggleMute(${r.id})">🔊</button></aside></article>`}
async function load(){try{reels=await api('/api/reels?limit=50');stage.innerHTML=reels.length?reels.map(reelHtml).join(''):`<div class="reel-empty"><div><h2>No reels yet</h2><p>Create the first HD reel.</p><a class="u-btn primary" href="/create-reel">Create reel</a></div></div>`;setupObserver()}catch(e){stage.innerHTML=`<div class="reel-empty">${escapeHtml(e.message)}</div>`}}
function setupObserver(){observer?.disconnect();observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{const v=entry.target.querySelector('video'),id=Number(entry.target.dataset.id);if(entry.isIntersecting&&entry.intersectionRatio>.72){document.querySelectorAll('.reel-video').forEach(x=>{if(x!==v)x.pause()});v.play().catch(()=>{});activeId=id;if(!viewTimers.has(id)){viewTimers.set(id,setTimeout(()=>api(`/api/reels/${id}/view?watched_seconds=3`,{method:'POST'}).catch(()=>{}),3000))}}else{v.pause()}})},{root:stage,threshold:[.25,.72]});document.querySelectorAll('.reel-slide').forEach(el=>observer.observe(el))}
async function toggleLike(id){const x=await api(`/api/reels/${id}/like`,{method:'POST'});const r=reels.find(x=>x.id===id);if(r){r.liked_by_me=x.liked;r.likes_count=x.likes_count}const el=document.querySelector(`.reel-slide[data-id="${id}"]`);if(el){const b=el.querySelector('.reel-rail .reel-action');b.classList.toggle('liked',x.liked);b.innerHTML=`${x.liked?'♥':'♡'}<span>${x.likes_count}</span>`}}
function toggleMute(id){const v=document.querySelector(`.reel-slide[data-id="${id}"] video`);if(!v)return;v.muted=!v.muted;event.currentTarget.textContent=v.muted?'🔇':'🔊'}
async function shareReel(id){const url=`${location.origin}/reels#reel-${id}`;try{if(navigator.share)await navigator.share({title:'SocialSphere Reel',url});else{await navigator.clipboard.writeText(url);alert('Reel link copied')}}catch{}}
async function openComments(id){activeId=id;document.getElementById('comments').classList.add('open');const rows=await api(`/api/reels/${id}/comments`);document.getElementById('commentsList').innerHTML=rows.length?rows.map(c=>`<div class="reel-comment-row"><img src="${fileUrl(c.profile_image,c.username)}"><div><b>@${escapeHtml(c.username)}</b><div>${escapeHtml(c.text)}</div></div></div>`).join(''):'<p class="u-muted">No comments yet.</p>'}
function closeComments(){document.getElementById('comments').classList.remove('open')}
document.getElementById('commentForm').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('commentInput'),text=input.value.trim();if(!text||!activeId)return;await api(`/api/reels/${activeId}/comments`,{method:'POST',body:JSON.stringify({text})});input.value='';await openComments(activeId)};
async function deleteReel(id){if(!confirm('Delete this reel?'))return;await api(`/api/reels/${id}`,{method:'DELETE'});await load()}
(async()=>{me=await ensureAuthenticated();if(me)await load()})();
</script></body></html>
