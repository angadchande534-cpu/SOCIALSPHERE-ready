<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Call | SocialSphere</title><link rel="stylesheet" href="/css/ultimate.css"><script src="/js/api.js"></script>  <link rel="stylesheet" href="/css/premium.css">
</head><body class="u-page"><main class="call-screen"><section class="call-card"><video id="remote" class="remote-video" autoplay playsinline></video><video id="local" class="local-video" autoplay muted playsinline></video><div class="call-info"><h2 id="name">Connecting…</h2><p id="status">Preparing call</p></div><div class="call-controls"><button id="mic" class="call-control">🎙</button><button id="cam" class="call-control">📹</button><button id="end" class="call-control end">✕</button></div></section></main>
<script>
let me,targetId=Number(new URLSearchParams(location.search).get('user_id')),mode=new URLSearchParams(location.search).get('mode')||'video',incoming=new URLSearchParams(location.search).get('incoming')==='1',ws,pc,stream,remoteStream=new MediaStream(),started=false;const remote=document.getElementById('remote'),local=document.getElementById('local'),statusEl=document.getElementById('status');remote.srcObject=remoteStream;
const rtc={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
async function prepare(){me=await ensureAuthenticated();if(!me||!targetId){statusEl.textContent='Missing user';return}try{const p=await api(`/api/users/${targetId}`);document.getElementById('name').textContent=p.user.full_name||'@'+p.user.username}catch{}stream=await navigator.mediaDevices.getUserMedia({audio:true,video:mode==='video'});local.srcObject=stream;pc=new RTCPeerConnection(rtc);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>e.streams[0].getTracks().forEach(t=>remoteStream.addTrack(t));pc.onicecandidate=e=>{if(e.candidate)send({type:'ice',candidate:e.candidate})};connectSocket()}
function connectSocket(){const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws/calls?token=${encodeURIComponent(token())}`);ws.onopen=()=>statusEl.textContent='Ready';ws.onmessage=async e=>{const d=JSON.parse(e.data);if(d.from_user_id!==targetId)return;if(d.type==='answer'){await pc.setRemoteDescription(d.answer);statusEl.textContent='Connected'}else if(d.type==='offer'){await pc.setRemoteDescription(d.offer);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);send({type:'answer',answer:pc.localDescription});statusEl.textContent='Connected'}else if(d.type==='ice'&&d.candidate){try{await pc.addIceCandidate(d.candidate)}catch{}}else if(d.type==='hangup'){statusEl.textContent='Call ended';end(false)}};ws.onopen=async()=>{if(incoming){statusEl.textContent='Connecting…';let pending=null;try{pending=JSON.parse(sessionStorage.getItem('socialsphere_pending_call')||'null')}catch{}sessionStorage.removeItem('socialsphere_pending_call');if(pending?.offer){await pc.setRemoteDescription(pending.offer);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);send({type:'answer',answer:pc.localDescription,call_mode:mode});statusEl.textContent='Connected';started=true}else{statusEl.textContent='Call invitation expired'}}else{statusEl.textContent='Calling…';const offer=await pc.createOffer();await pc.setLocalDescription(offer);send({type:'offer',offer:pc.localDescription,call_mode:mode});started=true}}}
function send(data){if(ws?.readyState===1)ws.send(JSON.stringify({...data,target_user_id:targetId}))}
function end(notify=true){if(notify)send({type:'hangup'});stream?.getTracks().forEach(t=>t.stop());pc?.close();setTimeout(()=>location.href=`/messages?user_id=${targetId}`,200)}
document.getElementById('mic').onclick=e=>{const t=stream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;e.currentTarget.textContent=t.enabled?'🎙':'🔇'}};document.getElementById('cam').onclick=e=>{const t=stream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;e.currentTarget.textContent=t.enabled?'📹':'🚫'}};document.getElementById('end').onclick=()=>end();prepare().catch(e=>statusEl.textContent=e.message);
</script></body></html>
