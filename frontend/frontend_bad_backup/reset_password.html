<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | SocialSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/css/ultimate.css">
  <link rel="stylesheet" href="/css/premium.css">
  <script src="/js/api.js"></script>
  <style>
    .reset-shell{min-height:100vh;display:grid;place-items:center;padding:32px 18px;position:relative;z-index:2}.reset-card{width:min(100%,500px);padding:36px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(16,18,31,.88);backdrop-filter:blur(20px);box-shadow:0 25px 80px rgba(0,0,0,.35)}
    .reset-icon{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;margin-bottom:22px;font-size:26px;background:linear-gradient(135deg,#7c5cff,#3fc5ff);color:#fff}.reset-card h1{font-size:30px;margin:0 0 10px;color:#fff}.reset-card>p{color:#aeb3c7;line-height:1.65;margin:0 0 25px}
    .group{margin:0 0 16px}.group label{display:block;color:#e8e9f2;font-weight:600;margin:0 0 9px}.field{position:relative}.field i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#9298ad}.field input{width:100%;box-sizing:border-box;padding:15px 46px 15px 44px;border-radius:14px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);color:#fff;outline:none;font:inherit}.field input:focus{border-color:#7c5cff;box-shadow:0 0 0 3px rgba(124,92,255,.15)}.eye{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:#aeb3c7;cursor:pointer}
    .reset-btn{width:100%;margin-top:5px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#3fc5ff);color:#fff;font:700 15px Poppins,sans-serif;cursor:pointer}.reset-btn:disabled{opacity:.65}.msg{display:none;margin:17px 0 0;padding:13px 15px;border-radius:12px;line-height:1.5;font-size:14px}.msg.show{display:block}.msg.success{background:rgba(54,211,153,.12);color:#78e9bd;border:1px solid rgba(54,211,153,.25)}.msg.error{background:rgba(255,99,132,.12);color:#ff9bb1;border:1px solid rgba(255,99,132,.25)}.back{display:block;margin-top:22px;text-align:center;color:#b9bfd2;text-decoration:none}.back:hover{color:#fff}
  </style>
</head>
<body class="login-page">
  <div class="login-orb login-orb-one"></div><div class="login-orb login-orb-two"></div><div class="login-orb login-orb-three"></div>
  <main class="reset-shell"><section class="reset-card">
    <div class="reset-icon"><i class="fa-solid fa-lock"></i></div><h1>Create a new password</h1><p>Choose a strong password with at least 6 characters.</p>
    <form id="resetForm">
      <div class="group"><label for="password">New password</label><div class="field"><i class="fa-solid fa-lock"></i><input id="password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required><button class="eye" type="button" data-target="password"><i class="fa-regular fa-eye"></i></button></div></div>
      <div class="group"><label for="confirm">Confirm new password</label><div class="field"><i class="fa-solid fa-shield-halved"></i><input id="confirm" type="password" minlength="6" maxlength="128" autocomplete="new-password" required><button class="eye" type="button" data-target="confirm"><i class="fa-regular fa-eye"></i></button></div></div>
      <button class="reset-btn" id="resetBtn" type="submit">Change password</button>
    </form>
    <div id="message" class="msg"></div><a class="back" href="/login"><i class="fa-solid fa-arrow-left"></i> Back to login</a>
  </section></main>
  <script>
    const tokenValue=new URLSearchParams(location.search).get('token') || '';
    const form=document.getElementById('resetForm'), password=document.getElementById('password'), confirmPassword=document.getElementById('confirm'), btn=document.getElementById('resetBtn'), message=document.getElementById('message');
    function show(text,type){message.textContent=text;message.className=`msg show ${type}`;}
    document.querySelectorAll('.eye').forEach(button=>button.addEventListener('click',()=>{const input=document.getElementById(button.dataset.target);const hidden=input.type==='password';input.type=hidden?'text':'password';button.innerHTML=hidden?'<i class="fa-regular fa-eye-slash"></i>':'<i class="fa-regular fa-eye"></i>';}));
    if(!tokenValue){show('This reset link is missing its security token. Request a new reset link.','error');btn.disabled=true;}
    form.addEventListener('submit',async(e)=>{
      e.preventDefault(); if(password.value!==confirmPassword.value){show('Both passwords must match.','error');return;} if(password.value.length<6){show('Password must contain at least 6 characters.','error');return;}
      btn.disabled=true;btn.textContent='Changing password...';
      try{const data=await api('/api/auth/reset-password',{method:'POST',body:JSON.stringify({token:tokenValue,password:password.value})});show(data.message,'success');form.reset();setTimeout(()=>location.replace('/login'),1400);}catch(err){show(err.message || 'Could not reset password.','error');btn.disabled=false;btn.textContent='Change password';}
    });
  </script>
</body>
</html>
